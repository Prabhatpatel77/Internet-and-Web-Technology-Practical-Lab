<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Department Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navigation Bar -->
<nav class="navbar">
    <div class="nav-container">
        <div class="logo">🏢 Department Portal</div>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/about">About Us</a></li>
            <li id="authLinks" style="display: none;">
                <a href="/login" class="btn-login">Login</a>
                <a href="/register" class="btn-register">Register</a>
            </li>
            <li id="userLinks" style="display: block;">
                <span id="userName"></span>
                <a href="#" onclick="logout(); return false;" class="btn-logout">Logout</a>
            </li>
        </ul>
    </div>
</nav>

<!-- Dashboard Section -->
<section class="dashboard-section">
    <div class="container">
        <h2>Welcome to Your Dashboard</h2>
        
        <!-- User Profile Card -->
        <div class="dashboard-grid">
            <div class="dashboard-card profile-card">
                <h3>👤 Your Profile</h3>
                <div id="userProfile">
                    <!-- User profile will load here -->
                </div>
            </div>

            <!-- Statistics Card -->
            <div class="dashboard-card">
                <h3>📊 Quick Stats</h3>
                <div class="stat-item">
                    <p>Total Departments</p>
                    <h4 id="deptCount">-</h4>
                </div>
                <div class="stat-item">
                    <p>Active Users</p>
                    <h4>Counting...</h4>
                </div>
            </div>

            <!-- Departments Card -->
            <div class="dashboard-card full-width">
                <h3>🏢 Available Departments</h3>
                <div id="userDepartments" class="departments-list">
                    <!-- Departments will load here -->
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Footer -->
<footer class="footer">
    <div class="container">
        <p>&copy; 2024 Department Portal. All rights reserved.</p>
    </div>
</footer>

<script src="script.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        checkUserLogin();
        loadUserProfile();
        loadDashboardDepartments();
    });
</script>

</body>
</html>
