<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Department Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navigation Bar -->
<nav class="navbar">
    <div class="nav-container">
        <div class="logo">🏢 Department Portal</div>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/about">About Us</a></li>
            <li id="authLinks" style="display: block;">
                <a href="/login" class="btn-login">Login</a>
                <a href="/register" class="btn-register">Register</a>
            </li>
            <li id="userLinks" style="display: none;">
                <span id="userName"></span>
                <a href="#" onclick="logout(); return false;" class="btn-logout">Logout</a>
            </li>
        </ul>
    </div>
</nav>

<!-- Login Form Section -->
<section class="auth-section">
    <div class="auth-container">
        <div class="auth-card">
            <h2>Login to Your Account</h2>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Enter your username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="btn-primary">Login</button>
            </form>

            <p id="message" class="message"></p>

            <p class="auth-link">
                Don't have an account? <a href="/register">Register here</a>
            </p>
        </div>
    </div>
</section>

<!-- Footer -->
<footer class="footer">
    <div class="container">
        <p>&copy; 2024 Department Portal. All rights reserved.</p>
    </div>
</footer>

<script src="script.js"></script>
<script>
    // Check login status on page load
    document.addEventListener('DOMContentLoaded', () => {
        checkUserLogin();
    });

    // Handle login form submission
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const message = document.getElementById('message');

        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (response.ok) {
                message.style.color = 'green';
                message.textContent = '✓ Login successful! Redirecting...';
                
                // Update navbar before redirecting
                updateNavbarLoggedIn(data.user);
                
                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 1500);
            } else {
                message.style.color = 'red';
                message.textContent = '✗ ' + data.error;
            }
        } catch (error) {
            message.style.color = 'red';
            message.textContent = '✗ Server error. Please try again.';
        }
    });
</script>

</body>
</html>
